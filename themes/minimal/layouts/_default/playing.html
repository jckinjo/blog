{{- define "main" }}
<div class="playing-page">
    <div class="video-grid">
        {{- .Content }}
    </div>
</div>

<script>
var grid = document.querySelector('.video-grid');
grid.addEventListener('click', function (event) {
    var facade = event.target.closest('.video-facade');
    if (!facade) return;

    event.preventDefault();

    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube-nocookie.com/embed/' + facade.dataset.youtubeId + '?autoplay=1';
    iframe.title = facade.getAttribute('aria-label').replace('Play video: ', '');
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    iframe.referrerPolicy = 'strict-origin-when-cross-origin';
    iframe.allowFullscreen = true;

    facade.replaceWith(iframe);
});
</script>
{{- end }}
